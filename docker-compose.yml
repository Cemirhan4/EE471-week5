services:
  speech-studio:
    build:
      context: ./Week-5-Task-1
      dockerfile: Dockerfile
    container_name: ee471-speech-studio
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped

  voice-calculator:
    build:
      context: ./Week-5-Task-2
      dockerfile: Dockerfile
    container_name: ee471-voice-calculator
    ports:
      - "5002:5002"
    env_file:
      - .env
    restart: unless-stopped
