<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text-to-Speech — Azure Speech Services</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      
      <!-- Header -->
      <div class="header">
        <div class="title-row">
          <svg class="icon-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <h1>Text-to-Speech</h1>
        </div>
        <p class="subtitle">Powered by Azure Cognitive Services</p>
      </div>

      <!-- Input Section -->
      <div class="form-group">
        <label for="text-input">Enter text to convert to speech:</label>
        <textarea id="text-input" placeholder="Hello, EE471 class" rows="4">Hello, EE471 class</textarea>
      </div>

      <!-- Action Buttons -->
      <div class="button-row">
        <button id="synthesize-btn" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <span id="btn-text">Synthesize Speech</span>
        </button>
        <button id="clear-btn" class="btn btn-secondary">Clear</button>
      </div>

      <!-- Status Message Badge -->
      <div id="status-badge" class="status-badge" style="display: none;">
        <span id="status-text">✓ Speech synthesized successfully!</span>
      </div>

      <!-- Generated Audio Section -->
      <div id="audio-section" class="audio-section" style="display: none;">
        <label>Generated Audio:</label>
        <div class="audio-wrapper">
          <audio id="audio-player" controls preload="auto"></audio>
        </div>
        <a id="download-btn" href="/download-audio" class="btn btn-download">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download Audio
        </a>
      </div>

    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
